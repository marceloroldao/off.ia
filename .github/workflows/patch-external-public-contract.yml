name: patch-external-public-contract
on:
  push:
    branches: [fix/android-external-public-contract]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-external-public-contract
          fetch-depth: 0
      - name: Apply contract patch
        run: python tools/patch_external_public_contract.py
      - name: Commit clean patch
        run: |
          rm tools/patch_external_public_contract.py .github/workflows/patch-external-public-contract.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/android-apk.yml android/app/src/main/java/ia/off/NativeMemoryGateway.kt tools/patch_external_public_contract.py .github/workflows/patch-external-public-contract.yml
          git commit -m "fix(android): align external_public contract with Memoria.ia"
          git push origin HEAD:fix/android-external-public-contract
