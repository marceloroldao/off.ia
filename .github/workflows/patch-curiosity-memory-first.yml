name: patch-curiosity-memory-first

on:
  push:
    branches:
      - feat/android-curiosity-memory-first

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OFF.IA
        uses: actions/checkout@v4
        with:
          ref: feat/android-curiosity-memory-first
          fetch-depth: 0

      - name: Apply memory-first Curiosity patch
        run: python scripts/patch_curiosity_memory_first.py

      - name: Commit final patch and remove executor
        shell: bash
        run: |
          rm -f .github/workflows/patch-curiosity-memory-first.yml scripts/patch_curiosity_memory_first.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(android): persist Curiosity sources before final LLM rendering"
          git push origin HEAD:feat/android-curiosity-memory-first
