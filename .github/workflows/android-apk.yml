name: android-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/android-mvp
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch pinned llama.cpp
        shell: bash
        run: |
          mkdir -p android/vendor
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp android/vendor/llama.cpp
          git -C android/vendor/llama.cpp fetch --depth 1 origin ca3d5a3e10d53f7ea672cb9b6178faca3e2807bc
          git -C android/vendor/llama.cpp checkout --detach ca3d5a3e10d53f7ea672cb9b6178faca3e2807bc

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'

      - name: Build debug APK with llama.cpp
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Upload OFF.IA APK
        uses: actions/upload-artifact@v6
        with:
          name: offia-android-llamacpp-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
