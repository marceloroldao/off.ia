name: android-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/android-mvp
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OFF.IA
        uses: actions/checkout@v6

      - name: Fetch pinned llama.cpp
        shell: bash
        run: |
          mkdir -p android/vendor
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp android/vendor/llama.cpp
          git -C android/vendor/llama.cpp fetch --depth 1 origin ca3d5a3e10d53f7ea672cb9b6178faca3e2807bc
          git -C android/vendor/llama.cpp checkout --detach ca3d5a3e10d53f7ea672cb9b6178faca3e2807bc
          python3 android/scripts/patch_llama_android_diagnostics.py

      - name: Checkout pinned Memoria.ia post-v1 mobile runtime
        uses: actions/checkout@v6
        with:
          repository: marceloroldao/memoria.ia
          ref: e91eabeebdee11472a1ea09ef7ea51ca2aeb3fa7
          path: android/vendor/memoria.ia

      - name: Checkout pinned Resolutive-DB Android ABI
        uses: actions/checkout@v6
        with:
          repository: marceloroldao/resolutive-DB
          ref: 1f6b7ccbe16bdfed2f1b5dcebceb17887bf6916e
          path: android/vendor/resolutive-DB

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Restore stable alpha signing key
        shell: bash
        run: |
          base64 --decode android/signing/offia-alpha.jks.b64 > android/offia-alpha.jks
          keytool -list -keystore android/offia-alpha.jks -storepass offia-alpha -alias offia-alpha >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'

      - name: Run Curiosity public-memory unit tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build full offline debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload OFF.IA full offline APK
        uses: actions/upload-artifact@v6
        with:
          name: offia-android-full-offline-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
