name: android-apk

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/android-mvp
      - feat/android-chat-ux-v3
      - fix/android-modern-skin-memoria-rc2
      - feat/android-memoria-rc4
      - feat/android-developer-diagnostics
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    env:
      OFFIA_KV_CACHE_TYPE: q8_0

    steps:
      - name: Checkout OFF.IA
        uses: actions/checkout@v6

      - name: Verify single product launcher source
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          path = 'android/app/src/main/AndroidManifest.xml'
          root = ET.parse(path).getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          app = root.find('application')
          activities = app.findall('activity') if app is not None else []
          names = [a.get(ns + 'name') for a in activities]
          if names != ['.LauncherActivity']:
              raise SystemExit(f'Expected exactly .LauncherActivity, found: {names}')
          activity = activities[0]
          has_main = False
          has_launcher = False
          for intent in activity.findall('intent-filter'):
              for action in intent.findall('action'):
                  has_main |= action.get(ns + 'name') == 'android.intent.action.MAIN'
              for category in intent.findall('category'):
                  has_launcher |= category.get(ns + 'name') == 'android.intent.category.LAUNCHER'
          if not (has_main and has_launcher):
              raise SystemExit('LauncherActivity is missing MAIN/LAUNCHER intent filter')
          print('Single product launcher verified:', names[0])
          PY

      - name: Fetch pinned llama.cpp
        shell: bash
        run: |
          mkdir -p android/vendor
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp android/vendor/llama.cpp
          git -C android/vendor/llama.cpp fetch --depth 1 origin ca3d5a3e10d53f7ea672cb9b6178faca3e2807bc
          git -C android/vendor/llama.cpp checkout --detach ca3d5a3e10d53f7ea672cb9b6178faca3e2807bc
          python3 android/scripts/patch_llama_android_diagnostics.py
          python3 android/scripts/patch_llama_kv_cache.py

      - name: Verify Q8_0 KV-cache default
        shell: bash
        run: |
          grep -q "OFF.IA KV cache mode: q8_0" android/vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q "ctx_params.type_k = GGML_TYPE_Q8_0" android/vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp
          grep -q "ctx_params.type_v = GGML_TYPE_Q8_0" android/vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/ai_chat.cpp

      - name: Checkout pinned Memoria.ia V2 structural mobile runtime
        uses: actions/checkout@v6
        with:
          repository: marceloroldao/memoria.ia
          ref: e38f27b639bec1cfcb83694c1418a4d01f250ffd
          path: android/vendor/memoria.ia

      - name: Checkout pinned Resolutive-DB Android ABI
        uses: actions/checkout@v6
        with:
          repository: marceloroldao/resolutive-DB
          ref: 317882a00f041fc1568ff986af8016b09453f21a
          path: android/vendor/resolutive-DB

      - name: Verify pinned runtime identities
        shell: bash
        run: |
          test "$(git -C android/vendor/llama.cpp rev-parse HEAD)" = "ca3d5a3e10d53f7ea672cb9b6178faca3e2807bc"
          test "$(git -C android/vendor/memoria.ia rev-parse HEAD)" = "e38f27b639bec1cfcb83694c1418a4d01f250ffd"
          grep -q 'version = "2.0.0rc2"' android/vendor/memoria.ia/pyproject.toml
          grep -q '#define MEMORIA_MOBILE_ABI_VERSION 1' android/vendor/memoria.ia/include/memoria_mobile.h
          grep -q 'memoria_mobile_observe_structural_text_json' android/vendor/memoria.ia/include/memoria_mobile.h
          grep -q 'memoria_mobile_resolve_structural_text_json' android/vendor/memoria.ia/include/memoria_mobile.h
          test "$(git -C android/vendor/resolutive-DB rev-parse HEAD)" = "317882a00f041fc1568ff986af8016b09453f21a"
          grep -Fq 'buildConfigField("String", "MEMORIA_IA_VERSION", "\"v2.0.0-rc2\"")' android/app/build.gradle.kts
          grep -Fq 'buildConfigField("String", "MEMORIA_IA_COMMIT", "\"e38f27b639bec1cfcb83694c1418a4d01f250ffd\"")' android/app/build.gradle.kts
          grep -Fq 'buildConfigField("String", "BDR_VERSION", "\"v1.2.0-rc4\"")' android/app/build.gradle.kts
          grep -Fq 'buildConfigField("String", "BDR_COMMIT", "\"317882a00f041fc1568ff986af8016b09453f21a\"")' android/app/build.gradle.kts
          grep -Fq 'buildConfigField("String", "LLAMA_CPP_COMMIT", "\"ca3d5a3e10d53f7ea672cb9b6178faca3e2807bc\"")' android/app/build.gradle.kts
          grep -Fq 'buildConfigField("String", "KV_CACHE_TYPE", "\"Q8_0\"")' android/app/build.gradle.kts
          grep -Fq 'buildConfigField("String", "MEMORIA_MOBILE_ABI", "\"v1\"")' android/app/build.gradle.kts
          grep -Fq 'buildConfigField("String", "OFFIA_COMMIT", "\"$offiaBuildCommit\"")' android/app/build.gradle.kts
          grep -Fq 'Text("OFF.IA: ${BuildConfig.VERSION_NAME}"' android/app/src/main/java/ia/off/SettingsPanel.kt
          grep -Fq 'Text("llama.cpp commit: ${shortIdentity(BuildConfig.LLAMA_CPP_COMMIT)}"' android/app/src/main/java/ia/off/SettingsPanel.kt
          grep -Fq 'Text("KV-cache: ${BuildConfig.KV_CACHE_TYPE}"' android/app/src/main/java/ia/off/SettingsPanel.kt
          grep -Fq 'Text("Copiar diagnóstico completo")' android/app/src/main/java/ia/off/SettingsPanel.kt

      - name: Build Memoria.ia V2 host runtime
        shell: bash
        run: |
          cmake -S android/vendor/memoria.ia/native/mobile \
            -B android/build/memoria-v2-host \
            -DMEMORIA_BDR_ROOT="$GITHUB_WORKSPACE/android/vendor/resolutive-DB"
          cmake --build android/build/memoria-v2-host --target memoria_mobile --parallel 2

      - name: Compile OFF.IA structural V2 native gate
        shell: bash
        run: |
          cc -std=c11 \
            -Iandroid/vendor/memoria.ia/include \
            android/app/src/main/cpp/tests/offia_structural_v2_host.c \
            -Landroid/build/memoria-v2-host \
            -lmemoria_mobile \
            -Wl,-rpath,"$GITHUB_WORKSPACE/android/build/memoria-v2-host" \
            -o android/build/offia-structural-v2-host

      - name: Run OFF.IA structural V2 native gate
        shell: bash
        run: android/build/offia-structural-v2-host

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android native toolchain
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Restore stable alpha signing key
        shell: bash
        run: |
          base64 --decode android/signing/offia-alpha.jks.b64 > android/offia-alpha.jks
          keytool -list -keystore android/offia-alpha.jks -storepass offia-alpha -alias offia-alpha >/dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'

      - name: Run Curiosity public-memory unit tests
        run: gradle -p android :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build full offline debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload OFF.IA full offline APK
        uses: actions/upload-artifact@v6
        with:
          name: offia-android-full-offline-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
