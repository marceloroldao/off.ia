name: apply-public-memory-hit-evidence

on:
  push:
    branches:
      - feat/android-public-memory-hit-evidence
    paths:
      - '.github/workflows/apply-public-memory-hit-evidence.yml'
      - 'scripts/apply_public_memory_hit_evidence.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OFF.IA
        uses: actions/checkout@v6
        with:
          ref: feat/android-public-memory-hit-evidence

      - name: Apply exact Kotlin patch
        run: python3 scripts/apply_public_memory_hit_evidence.py

      - name: Commit final patch and remove executor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-public-memory-hit-evidence.yml scripts/apply_public_memory_hit_evidence.py
          git add android/app/src/main/java/ia/off/PublicMemoryEvidence.kt \
                  android/app/src/main/java/ia/off/ChatStore.kt \
                  android/app/src/main/java/ia/off/MessageCard.kt \
                  android/app/src/test/java/ia/off/PublicMemoryEvidenceTest.kt
          git commit -m "feat(android): expose external public memory hit evidence"
          git push origin HEAD:feat/android-public-memory-hit-evidence
