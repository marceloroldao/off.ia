name: Patch Curiosity public audit

on:
  push:
    branches:
      - feat/android-curiosity-public-audit
    paths:
      - '.github/workflows/patch-public-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/android-curiosity-public-audit
      - name: Apply focused public audit patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected block not found: {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'android/app/src/main/java/ia/off/MainActivity.kt',
              '''                val publicLearning = learnCuriosityResult(
                    memory = memory,
                    result = result,
                    synthesis = answer.toString(),
                    sessionId = activeSessionId,
                    requestId = curiosityMessage.id,
                )
                saveWorkspace()
''',
              '''                val publicLearning = learnCuriosityResult(
                    memory = memory,
                    result = result,
                    synthesis = answer.toString(),
                    sessionId = activeSessionId,
                    requestId = curiosityMessage.id,
                )
                messages[curiosityIndex] = messages[curiosityIndex].copy(
                    generation = messages[curiosityIndex].generation?.copy(
                        publicKnowledge = publicLearning.toPublicKnowledgeAudit(),
                    ),
                )
                saveWorkspace()
''',
          )

          replace_exact(
              'android/app/src/main/java/ia/off/ChatStore.kt',
              '''                if (generation.publicSources.isNotEmpty()) {
                    put("public_sources", JSONArray().apply {
                        generation.publicSources.forEach { source ->
                            put(JSONObject().apply {
                                put("title", source.title)
                                put("url", source.url)
                                put("domain", source.domain)
                                source.excerpt?.let { put("excerpt", it) }
                            })
                        }
                    })
                }
''',
              '''                if (generation.publicSources.isNotEmpty()) {
                    put("public_sources", JSONArray().apply {
                        generation.publicSources.forEach { source ->
                            put(JSONObject().apply {
                                put("title", source.title)
                                put("url", source.url)
                                put("domain", source.domain)
                                source.excerpt?.let { put("excerpt", it) }
                            })
                        }
                    })
                }
                generation.publicKnowledge?.let { audit ->
                    put("public_knowledge", JSONObject().apply {
                        put("knowledge_class", audit.knowledgeClass)
                        put("source_memory_ids", JSONArray(audit.sourceMemoryIds))
                        put("stored_memory_ids", JSONArray(audit.storedMemoryIds))
                        put("synthesis_stored", audit.synthesisStored)
                        put("failed_source_count", audit.failedSourceCount)
                        put("flush_failed", audit.flushFailed)
                    })
                }
''',
          )

          replace_exact(
              'android/app/src/main/java/ia/off/ChatStore.kt',
              '''            GenerationMetadata(
                source = source,
                modelName = item.optString("model_name").takeIf { it.isNotBlank() },
                latencyMs = if (item.has("latency_ms") && !item.isNull("latency_ms")) item.optLong("latency_ms") else null,
                publicSources = publicSources,
            )
''',
              '''            val publicKnowledge = item.optJSONObject("public_knowledge")?.let { audit ->
                PublicKnowledgeAudit(
                    knowledgeClass = audit.optString("knowledge_class").takeIf { it == "external_public" }
                        ?: "external_public",
                    sourceMemoryIds = jsonStringList(audit.optJSONArray("source_memory_ids")),
                    storedMemoryIds = jsonStringList(audit.optJSONArray("stored_memory_ids")),
                    synthesisStored = audit.optBoolean("synthesis_stored", false),
                    failedSourceCount = audit.optInt("failed_source_count", 0).coerceAtLeast(0),
                    flushFailed = audit.optBoolean("flush_failed", false),
                )
            }
            GenerationMetadata(
                source = source,
                modelName = item.optString("model_name").takeIf { it.isNotBlank() },
                latencyMs = if (item.has("latency_ms") && !item.isNull("latency_ms")) item.optLong("latency_ms") else null,
                publicSources = publicSources,
                publicKnowledge = publicKnowledge,
            )
''',
          )

          replace_exact(
              'android/app/src/main/java/ia/off/MessageCard.kt',
              '''    val publicSources = message.generation?.publicSources.orEmpty()
''',
              '''    val publicSources = message.generation?.publicSources.orEmpty()
    val publicKnowledge = message.generation?.publicKnowledge
''',
          )

          replace_exact(
              'android/app/src/main/java/ia/off/MessageCard.kt',
              '''                PublicSourcesPanel(
                    sources = publicSources,
                    onOpen = { source ->
''',
              '''                PublicSourcesPanel(
                    sources = publicSources,
                    audit = publicKnowledge,
                    onOpen = { source ->
''',
          )

          replace_exact(
              'android/app/src/main/java/ia/off/MessageCard.kt',
              '''private fun PublicSourcesPanel(
    sources: List<CuriositySource>,
    onOpen: (CuriositySource) -> Unit,
) {
''',
              '''private fun PublicSourcesPanel(
    sources: List<CuriositySource>,
    audit: PublicKnowledgeAudit?,
    onOpen: (CuriositySource) -> Unit,
) {
''',
          )

          replace_exact(
              'android/app/src/main/java/ia/off/MessageCard.kt',
              '''            Text(
                "Estas fontes pertencem à resposta de Curiosidade e não foram gravadas automaticamente como memória pessoal.",
                style = MaterialTheme.typography.bodySmall,
            )
''',
              '''            Text(
                "Estas fontes são públicas/externas e nunca são registradas como afirmações pessoais do usuário.",
                style = MaterialTheme.typography.bodySmall,
            )
            audit?.let { publicAudit ->
                Text(
                    "Memoria.ia: ${publicAudit.knowledgeClass} • ${publicAudit.storedMemoryIds.size} registro(s) público(s)",
                    style = MaterialTheme.typography.bodySmall,
                )
                Text(
                    "IDs das fontes: ${if (publicAudit.sourceMemoryIds.isEmpty()) "—" else publicAudit.sourceMemoryIds.joinToString()}",
                    style = MaterialTheme.typography.bodySmall,
                )
                Text(
                    "Síntese derivada: ${if (publicAudit.synthesisStored) "aprendida" else "não aprendida"}",
                    style = MaterialTheme.typography.bodySmall,
                )
                if (publicAudit.failedSourceCount > 0) {
                    Text(
                        "Fontes rejeitadas/indisponíveis: ${publicAudit.failedSourceCount}",
                        style = MaterialTheme.typography.bodySmall,
                    )
                }
                if (publicAudit.flushFailed) {
                    Text(
                        "A Memoria.ia aceitou os registros, mas a barreira final de flush retornou falha.",
                        style = MaterialTheme.typography.bodySmall,
                    )
                }
            }
''',
          )

          replace_exact(
              'android/app/src/test/java/ia/off/CuriosityMemoryLearningTest.kt',
              '''        assertEquals(listOf("memory-1", "memory-2", "memory-3"), report.storedMemoryIds)
''',
              '''        assertEquals(listOf("memory-1", "memory-2", "memory-3"), report.storedMemoryIds)
        val audit = report.toPublicKnowledgeAudit()
        assertEquals("external_public", audit.knowledgeClass)
        assertEquals(report.sourceMemoryIds, audit.sourceMemoryIds)
        assertEquals(report.storedMemoryIds, audit.storedMemoryIds)
        assertTrue(audit.synthesisStored)
''',
          )

          p = Path('docs/CURIOSITY_MEMORY_LEARNING.md')
          text = p.read_text(encoding='utf-8')
          marker = '## Validation\n'
          addition = '''## Per-response audit\n\nEach persisted Curiosity response carries a UI-level audit snapshot with the Memoria.ia `external_public` class, learned source memory IDs, total stored public memory IDs, whether a derived synthesis was learned, rejected-source count and final flush status. This metadata belongs to the chat transcript only; it does not replace Memoria.ia provenance or duplicate BDR state. It survives chat workspace restart so device acceptance can verify which public memories were learned without reading raw BDR files.\n\n'''
          if marker not in text:
              raise SystemExit('validation marker not found in Curiosity docs')
          p.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY

      - name: Commit audit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/ia/off/MainActivity.kt \
                  android/app/src/main/java/ia/off/ChatStore.kt \
                  android/app/src/main/java/ia/off/MessageCard.kt \
                  android/app/src/test/java/ia/off/CuriosityMemoryLearningTest.kt \
                  docs/CURIOSITY_MEMORY_LEARNING.md
          git commit -m "feat(android): persist Curiosity public learning audit"
          git push origin HEAD:feat/android-curiosity-public-audit
