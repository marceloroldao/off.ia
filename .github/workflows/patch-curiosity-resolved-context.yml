name: patch-curiosity-resolved-context
on:
  push:
    branches: [feat/android-curiosity-resolved-context]
    paths:
      - tools/patch_curiosity_resolved_context.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-curiosity-resolved-context
      - run: python tools/patch_curiosity_resolved_context.py
      - run: |
          rm tools/patch_curiosity_resolved_context.py
          rm .github/workflows/patch-curiosity-resolved-context.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java/ia/off/MainActivity.kt tools/patch_curiosity_resolved_context.py .github/workflows/patch-curiosity-resolved-context.yml
          git commit -m "feat(android): render Curiosity from Memoria.ia resolved context"
          git push
