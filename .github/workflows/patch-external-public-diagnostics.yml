name: patch-external-public-diagnostics
on:
  push:
    branches:
      - fix/android-external-public-native-diagnostics
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OFF.IA
        uses: actions/checkout@v4
        with:
          ref: fix/android-external-public-native-diagnostics
      - name: Apply exact diagnostics patch
        run: python .github/scripts/patch_external_public_diagnostics.py
      - name: Commit final patch and remove executor
        run: |
          rm .github/workflows/patch-external-public-diagnostics.yml
          rm .github/scripts/patch_external_public_diagnostics.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(android): expose external public native rejection reason"
          git push origin HEAD:fix/android-external-public-native-diagnostics
