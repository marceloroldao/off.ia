name: patch-curiosity-phase-timings
on:
  push:
    branches: [feat/android-curiosity-phase-timings]
    paths:
      - tools/patch_curiosity_phase_timings.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-curiosity-phase-timings
      - run: python tools/patch_curiosity_phase_timings.py
      - run: |
          rm tools/patch_curiosity_phase_timings.py
          rm .github/workflows/patch-curiosity-phase-timings.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/java/ia/off/MainActivity.kt tools/patch_curiosity_phase_timings.py .github/workflows/patch-curiosity-phase-timings.yml
          git commit -m "perf(android): expose Curiosity phase timings"
          git push
