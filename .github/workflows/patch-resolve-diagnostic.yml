name: patch-resolve-diagnostic
on:
  push:
    branches: [fix/android-external-public-contract]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-external-public-contract
          fetch-depth: 0
      - name: Apply resolve diagnostic
        run: python tools/patch_resolve_diagnostic.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android/app/src/main/cpp/offia_memory_jni.cpp
          git commit -m "diag(android): expose native Memoria resolve failure"
          git push origin HEAD:fix/android-external-public-contract
